name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Stellar Base APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses 2>/dev/null || true

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" 2>/dev/null || true
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Download Godot 4.3 stable
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Download Godot Android export templates
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p "$TEMPLATES_DIR"
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d tpl_extracted
          cp tpl_extracted/templates/android_debug.apk     "$TEMPLATES_DIR/"
          cp tpl_extracted/templates/android_release.apk   "$TEMPLATES_DIR/"
          cp tpl_extracted/templates/android_source.zip    "$TEMPLATES_DIR/"

      - name: Generate debug keystore
        run: |
          keytool -genkey -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            2>/dev/null
          echo "KEYSTORE_PATH=$(pwd)/debug.keystore" >> $GITHUB_ENV
          echo "Keystore generated"

      - name: Configure Godot editor settings
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/debug_keystore = "%s"\nexport/android/debug_keystore_user = "androiddebugkey"\nexport/android/debug_keystore_pass = "android"\n' \
            "${ANDROID_SDK_ROOT}" \
            "$(pwd)/debug.keystore" \
            > "$HOME/.config/godot/editor_settings-4.tres"

      - name: Install Godot Android build template into project
        run: |
          TEMPLATES_DIR="$HOME/.local/share/godot/export_templates/4.3.stable"
          mkdir -p android/build
          cp "$TEMPLATES_DIR/android_source.zip" android/build/
          cd android/build && unzip -q android_source.zip && rm android_source.zip
          touch .gdignore && echo "4.3.stable" > version.txt && cd ../..

      - name: Install Python asset-generation dependencies
        run: pip install numpy pillow --quiet

      - name: Generate 300MB procedural game assets
        run: |
          python3 << 'PYEOF'
          import numpy as np
          from PIL import Image
          import os, wave, struct, math

          def noise2d(w, h, scale=0.25, octaves=7, seed=0):
              rng = np.random.RandomState(seed)
              out = np.zeros((h, w), dtype=np.float32)
              amp, freq, total = 1.0, 1.0, 0.0
              for _ in range(octaves):
                  sw = max(4, int(w * scale * freq))
                  sh = max(4, int(h * scale * freq))
                  base = rng.rand(sh, sw).astype(np.float32)
                  img = Image.fromarray((base * 255).astype(np.uint8))
                  img = img.resize((w, h), Image.BILINEAR)
                  out += np.array(img, dtype=np.float32) / 255.0 * amp
                  total += amp; amp *= 0.5; freq *= 2.0
              return out / total

          def albedo(w, h, palette, seed):
              n = noise2d(w, h, seed=seed)
              img = np.zeros((h, w, 3), dtype=np.uint8)
              steps = len(palette) - 1
              for i in range(steps):
                  lo, hi = i / steps, (i + 1) / steps
                  mask = (n >= lo) & (n < hi)
                  t = np.clip((n - lo) / (hi - lo + 1e-8), 0, 1)
                  c1 = np.array(palette[i],   dtype=np.float32)
                  c2 = np.array(palette[i+1], dtype=np.float32)
                  for ch in range(3):
                      blend = (c1[ch] * (1 - t) + c2[ch] * t).astype(np.uint8)
                      img[:, :, ch] = np.where(mask, blend, img[:, :, ch])
              return Image.fromarray(img)

          def normalmap(w, h, seed, strength=12.0):
              n = noise2d(w, h, seed=seed + 500)
              gx = np.gradient(n, axis=1) * strength
              gy = np.gradient(n, axis=0) * strength
              ln = np.sqrt(gx**2 + gy**2 + 1.0)
              r = ((-gx / ln + 1) * 0.5 * 255).astype(np.uint8)
              g = ((-gy / ln + 1) * 0.5 * 255).astype(np.uint8)
              b = ((1.0 / ln) * 255).astype(np.uint8)
              return Image.fromarray(np.stack([r, g, b], axis=2))

          def skybox(w, h, horizon, zenith, seed):
              rng = np.random.RandomState(seed + 2000)
              img = np.zeros((h, w, 3), dtype=np.uint8)
              for y in range(h):
                  t = y / h
                  for ch in range(3):
                      img[y, :, ch] = int(zenith[ch] * (1 - t) + horizon[ch] * t)
              cloud = noise2d(w, h, scale=0.15, octaves=5, seed=seed + 3000)
              for ch in range(3):
                  layer = (cloud * 40).astype(np.uint8)
                  img[:h//2, :, ch] = np.clip(img[:h//2, :, ch].astype(int) + layer[:h//2], 0, 255).astype(np.uint8)
              xs = rng.randint(0, w, 8000); ys = rng.randint(0, h * 2 // 3, 8000)
              br = rng.randint(160, 255, 8000)
              for i in range(8000):
                  img[ys[i], xs[i]] = [br[i], br[i], min(255, br[i] + 20)]
              return Image.fromarray(img)

          PLANETS = [
            ("mars",    [(80,30,10),(139,60,20),(178,90,35),(210,130,60),(230,170,100),(200,140,80)],
                        (210,90,40), (30,10,5),   0),
            ("europa",  [(140,155,185),(170,185,210),(190,205,225),(210,220,235),(230,235,245),(255,255,255)],
                        (60,100,195), (8,15,60),   1),
            ("io",      [(100,55,0),(160,90,5),(200,130,15),(230,170,25),(240,200,60),(220,160,30)],
                        (210,90,20),  (40,20,5),   2),
            ("neptune", [(20,40,120),(35,65,150),(50,85,175),(60,100,190),(75,115,200),(90,130,210)],
                        (25,55,170),  (5,10,55),   3),
          ]

          os.makedirs("assets/textures/planets",  exist_ok=True)
          os.makedirs("assets/textures/skybox",   exist_ok=True)
          os.makedirs("assets/textures/detail",   exist_ok=True)
          os.makedirs("assets/audio/music",       exist_ok=True)
          os.makedirs("assets/audio/sfx",         exist_ok=True)

          # Generate app icon (512x512 RGBA)
          icon = Image.new("RGBA", (512, 512), (15, 15, 40, 255))
          from PIL import ImageDraw
          draw = ImageDraw.Draw(icon)
          # Simple rocket silhouette
          draw.ellipse([180, 80, 332, 280], fill=(60, 120, 220, 255))
          draw.polygon([(256,40),(200,160),(312,160)], fill=(80,160,255,255))
          draw.rectangle([220, 260, 292, 360], fill=(50,100,200,255))
          draw.polygon([(200,340),(220,360),(220,400)], fill=(200,80,20,255))
          draw.polygon([(292,340),(312,360),(312,400)], fill=(200,80,20,255))
          icon.save("assets/icon.png")
          print("Icon generated")

          for name, palette, horizon, zenith, seed in PLANETS:
              print(f"Texturing {name}...")
              albedo(2048, 2048, palette, seed).save(f"assets/textures/planets/{name}_albedo.png")
              normalmap(2048, 2048, seed).save(f"assets/textures/planets/{name}_normal.png")
              albedo(1024, 1024, [(40,40,40),(180,180,180),(220,220,220)], seed+100).save(f"assets/textures/planets/{name}_roughness.png")
              albedo(512,  512,  palette, seed+200).save(f"assets/textures/planets/{name}_emissive.png")
              skybox(4096, 2048, horizon, zenith, seed).save(f"assets/textures/skybox/{name}_sky.png")

          detail_palettes = [
            [(60,45,30),(100,80,55),(140,115,80),(180,150,110)],
            [(180,190,210),(200,210,225),(220,225,235),(240,245,250)],
            [(80,20,0),(140,50,10),(180,90,20),(220,140,40)],
            [(200,170,120),(220,190,140),(240,210,160),(255,230,190)],
            [(50,55,60),(80,85,90),(110,115,120),(150,155,160)],
            [(100,70,40),(130,95,60),(160,120,80),(190,150,110)],
            [(20,60,120),(35,80,150),(55,100,175),(80,130,200)],
            [(120,30,10),(160,60,20),(200,100,30),(230,145,55)],
            [(45,50,35),(70,80,55),(100,115,80),(140,155,115)],
            [(160,140,120),(185,165,140),(210,190,165),(235,215,195)],
            [(30,30,35),(55,55,60),(85,85,90),(120,120,130)],
            [(90,80,50),(120,108,70),(150,135,90),(185,168,120)],
          ]
          for i, pal in enumerate(detail_palettes):
              albedo(2048, 2048, pal, seed=i+20).save(f"assets/textures/detail/tile_{i:02d}.png")
              print(f"Detail tile {i:02d} done")

          SR = 44100
          def gen_wav(path, secs, base_hz, chord=None, seed=0):
              rng = np.random.RandomState(seed)
              n = int(SR * secs)
              t = np.linspace(0, secs, n, dtype=np.float64)
              sig = np.zeros(n)
              freqs = chord if chord else [base_hz]
              for i, f in enumerate(freqs):
                  for h in [1, 2, 3, 4]:
                      sig += np.sin(2 * np.pi * f * h * t) * (0.15 / h)
                  lfo = 0.5 + 0.5 * np.sin(2 * np.pi * 0.1 * t + i)
                  sig *= lfo
              sig += rng.randn(n) * 0.008
              sig = np.clip(sig / max(1.0, np.max(np.abs(sig))) * 0.9, -1.0, 1.0)
              pcm = (sig * 32767).astype(np.int16)
              stereo = np.column_stack([pcm, pcm]).tobytes()
              with wave.open(path, 'w') as wf:
                  wf.setnchannels(2); wf.setsampwidth(2); wf.setframerate(SR)
                  wf.writeframes(stereo)

          MUSIC = [
            ("mars",    120, 110, [110,138,165,220]),
            ("europa",  120, 130, [130,155,195,260]),
            ("io",      120,  95, [ 95,120,142,190]),
            ("neptune", 120, 100, [100,125,150,200]),
          ]
          for name, secs, hz, chord in MUSIC:
              print(f"Audio: {name}_theme.wav ({secs}s)...")
              gen_wav(f"assets/audio/music/{name}_theme.wav", secs, hz, chord,
                      seed=PLANETS[[p[0] for p in PLANETS].index(name)][4])

          SFX = [
            ("footstep",    0.35, 320, [320,480]),
            ("footstep_2",  0.35, 280, [280,420]),
            ("pickup",      0.45, 880, [880,1100,1320]),
            ("build",       0.70, 220, [220,330,440]),
            ("build_done",  0.80, 440, [440,550,660,880]),
            ("error",       0.40, 180, [180,200]),
            ("success",     0.60, 660, [660,880,990]),
            ("menu_click",  0.18, 600, [600,750]),
            ("oxygen_low",  1.20, 160, [160,180,200]),
            ("explosion",   1.50,  80, [ 80,100,120,160]),
            ("ambient_wind",6.00,  60, [ 60, 90, 45]),
            ("mine",        0.55, 240, [240,300,360]),
            ("travel",      2.00, 130, [130,195,260,390]),
            ("upgrade",     0.70, 550, [550,660,770,880,1100]),
            ("death",       2.00,  90, [ 90,100,80]),
          ]
          for name, secs, hz, chord in SFX:
              gen_wav(f"assets/audio/sfx/{name}.wav", secs, hz, chord)

          print("All assets generated!")
          import subprocess
          result = subprocess.run(['du', '-sh', 'assets/'], capture_output=True, text=True)
          print("Asset size:", result.stdout.strip())
          PYEOF

      - name: Import project
        run: |
          timeout 180 godot --headless --import 2>&1 | tail -20 || true
          echo "Import done"

      - name: Create output directory
        run: mkdir -p build

      - name: Export APK (debug)
        run: |
          godot --headless --export-debug "Android" build/stellar-base-unsigned.apk 2>&1
          echo "Export exit code: $?"
          ls -lah build/ || echo "build/ empty"

      - name: Align and sign APK
        run: |
          ZIPALIGN="${ANDROID_SDK_ROOT}/build-tools/34.0.0/zipalign"
          APKSIGNER="${ANDROID_SDK_ROOT}/build-tools/34.0.0/apksigner"

          # Prefer the exported APK; look everywhere if not at expected path
          RAW_APK=$(find build -name "*.apk" | head -1)
          if [ -z "$RAW_APK" ]; then
            RAW_APK=$(find . -name "*.apk" ! -path "./debug.keystore" | head -1)
          fi

          if [ -z "$RAW_APK" ]; then
            echo "ERROR: No APK found to sign!"
            exit 1
          fi

          echo "Signing: $RAW_APK"

          # zipalign — required before signing
          $ZIPALIGN -v -p 4 "$RAW_APK" build/stellar-base-aligned.apk 2>&1 | tail -5 || true

          # Sign with debug keystore
          $APKSIGNER sign \
            --ks debug.keystore \
            --ks-pass pass:android \
            --key-pass pass:android \
            --ks-key-alias androiddebugkey \
            --out build/stellar-base.apk \
            build/stellar-base-aligned.apk

          echo "Signing complete"
          $APKSIGNER verify --verbose build/stellar-base.apk | head -10

          # Clean up intermediate files
          rm -f build/stellar-base-unsigned.apk build/stellar-base-aligned.apk

      - name: Verify output
        run: |
          echo "=== Final APK ==="
          ls -lah build/*.apk 2>/dev/null || echo "No APK in build/"
          find . -name "*.apk" ! -name "*unsigned*" ! -name "*aligned*" | xargs ls -lah 2>/dev/null

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: stellar-base-apk
          path: build/stellar-base.apk
          if-no-files-found: error
          retention-days: 30
