name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build Stellar Base APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Download Godot 4.3
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q Godot_v4.3-stable_linux.x86_64.zip
          chmod +x Godot_v4.3-stable_linux.x86_64
          sudo mv Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Download export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz
          cp templates/android_debug.apk ~/.local/share/godot/export_templates/4.3.stable/
          cp templates/android_release.apk ~/.local/share/godot/export_templates/4.3.stable/
          echo "Templates ready"

      - name: Configure Godot Android settings
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres << 'SETTINGS'
[gd_resource type="EditorSettings" format=3]
[resource]
export/android/android_sdk_path = "/usr/local/lib/android/sdk"
SETTINGS

      - name: Setup Godot Android build
        run: |
          mkdir -p android/build
          godot --headless --android-build-directory android/build 2>&1 || true

      - name: Import project
        run: |
          timeout 120 godot --headless --import 2>&1 | tail -5 || true

      - name: Create output directory
        run: mkdir -p build

      - name: Export debug APK
        run: |
          godot --headless --export-debug "Android" build/stellar-base-debug.apk 2>&1

      - name: List build output
        run: |
          echo "=== Build output ==="
          find build/ -name "*.apk" -exec ls -lah {} \; 2>/dev/null || echo "No APK files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: stellar-base-apk
          path: build/*.apk
          if-no-files-found: warn
          retention-days: 30
