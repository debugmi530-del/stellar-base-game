name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Stellar Base APK
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Install Android build tools
        run: |
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;25.2.9519653"

      - name: Download Godot 4.3
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip
          mv Godot_v4.3-stable_linux.x86_64 godot
          chmod +x godot
          echo "$(pwd)" >> $GITHUB_PATH

      - name: Download Godot Android export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates/4.3.stable/
          wget -q "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d templates_extracted
          cp templates_extracted/templates/android_debug.apk ~/.local/share/godot/export_templates/4.3.stable/
          cp templates_extracted/templates/android_release.apk ~/.local/share/godot/export_templates/4.3.stable/
          cp templates_extracted/templates/android_source.zip ~/.local/share/godot/export_templates/4.3.stable/ || true

      - name: Setup Godot Android build environment
        run: |
          mkdir -p android/build
          ./godot --headless --export-release "Android" build/stellar-base.apk 2>&1 | head -5 || true
          ./godot --headless --android-build-directory android/build 2>&1 | head -5 || true

      - name: Set Android SDK path in Godot editor settings
        run: |
          mkdir -p ~/.config/godot/
          cat > ~/.config/godot/editor_settings-4.tres << SETTINGS
[gd_resource type="EditorSettings" format=3]

[resource]
export/android/android_sdk_path = "$ANDROID_HOME"
export/android/java_sdk_path = "$JAVA_HOME"
SETTINGS

      - name: Create build directory
        run: mkdir -p build

      - name: Import project (generate .godot cache)
        run: |
          timeout 120 ./godot --headless --import --path . 2>&1 || true
          echo "Import done"

      - name: Export APK (debug)
        run: |
          timeout 300 ./godot --headless --export-debug "Android" build/stellar-base-debug.apk --path . 2>&1
          echo "Export done"

      - name: Verify APK exists
        run: |
          ls -lah build/ || echo "Build directory contents:"
          find . -name "*.apk" 2>/dev/null || echo "No APK found"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: stellar-base-apk
          path: build/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Create Release on tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/stellar-base-debug.apk
          name: "Stellar Base ${{ github.ref_name }}"
          body: |
            ## Stellar Base - Космический симулятор
            
            ### Что нового
            - Сборка для Android (APK)
            
            ### Установка
            1. Скачайте APK файл
            2. Разрешите установку из неизвестных источников
            3. Установите APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
